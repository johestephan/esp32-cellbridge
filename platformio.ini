; PlatformIO Project Configuration File
; Target: LilyGO T-A7670E R2 (ESP32-WROVER-E, 4MB Flash, 8MB PSRAM)
; Also compatible with LilyGO T-A7608X ESP32 Version (-DBOARD_LILYGO_T_A7608X)

[platformio]
default_envs = lilygo-t-a7670e-r2

[env:lilygo-t-a7670e-r2]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags =
    -DBOARD_LILYGO_T_A7670E_R2
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

[env:lilygo-t-a7608x]
extends = env:lilygo-t-a7670e-r2
build_flags =
    -DBOARD_LILYGO_T_A7608X
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST_NATIVE
test_ignore = test_embedded*
